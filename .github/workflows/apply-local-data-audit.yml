name: Apply audited local-data source
on:
  push:
    branches: ['work/unity-client-parity-v0.4.0']
    paths:
      - '.github/workflows/apply-local-data-audit.yml'
      - 'Tools/AuditTransport/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify branch, parent, transport and source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/unity-client-parity-v0.4.0'
          test "$(git rev-parse HEAD^)" = '8e980d61ff8f101c53910d0fb831a8e3ad4d6991'
          python - <<'PY'
          import pathlib, hashlib, gzip, subprocess, tempfile
          root = pathlib.Path('Tools/AuditTransport')
          packed = b''.join((root / ('local-data.patch.gz.' + str(i))).read_bytes() for i in range(4))
          assert len(packed) == 23816
          assert hashlib.sha256(packed).hexdigest() == 'd49619571cc869dd36afaf5aef513f6d01ed3d1d60e29df0df9cf3a43700c168'
          patch = gzip.decompress(packed)
          assert len(patch) == 101820
          assert hashlib.sha256(patch).hexdigest() == 'c20e46a2d82aae39c9fb717b98023bd14db07a70c5729876f285335b8bb47ba8'
          with tempfile.NamedTemporaryFile(suffix='.patch') as handle:
              handle.write(patch)
              handle.flush()
              subprocess.run(['git', 'apply', '--check', '--index', handle.name], check=True)
              subprocess.run(['git', 'apply', '--index', '--whitespace=error', handle.name], check=True)
          PY
          git diff --cached --stat
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Validate sources and deterministic gameplay
        shell: bash
        run: |
          set -euo pipefail
          python Tools/validate_project.py
          dotnet run --project Tools/ParityHarness/ParityHarness.csproj --configuration Release
          dotnet run --project Tools/LocalDataHarness/LocalDataHarness.csproj --configuration Release
          pwsh -NoProfile -File Tools/CI/Test-CharacterParityDiscovery.ps1
      - name: Commit validated source on work branch only
        shell: bash
        run: |
          set -euo pipefail
          branch='work/unity-client-parity-v0.4.0'
          test "$GITHUB_REF" = "refs/heads/$branch"
          remote_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          git restore --worktree SOURCE_SHA256.txt
          git rm .github/workflows/apply-local-data-audit.yml Tools/AuditTransport/local-data.patch.gz.{0,1,2,3}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(client): load local DATA and repair multirig bind compatibility'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Applied source commit: '
          git rev-parse HEAD
