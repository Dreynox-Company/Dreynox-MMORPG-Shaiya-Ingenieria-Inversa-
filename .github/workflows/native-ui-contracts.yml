name: Native UI pixel and input contracts
on:
  push:
    branches: ['work/unity-client-parity-v0.4.0']
    paths: ['Assets/DreynoxMMORPG/Runtime/UI/**', 'Assets/DreynoxMMORPG/Runtime/Gameplay/**', 'Assets/DreynoxMMORPG/Runtime/ParityCore/**', 'Tools/NativeUiHarness/**', '.github/workflows/native-ui-contracts.yml']
permissions: {contents: read, actions: read}
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '8.0.x'}
      - run: python Tools/validate_project.py
      - run: dotnet run --project Tools/NativeUiHarness/NativeUiHarness.csproj --configuration Release
      - run: dotnet run --project Tools/CombatHarness/CombatHarness.csproj --configuration Release
      - run: dotnet run --project Tools/QuestHarness/QuestHarness.csproj --configuration Release
      - name: Verify immutable reference-assembly provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/actions/artifacts/10896444373'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: artifact=json.load(response)
          assert artifact['id']==10896444373 and not artifact['expired']
          assert artifact['workflow_run']['id']==36210070334
          assert artifact['workflow_run']['head_sha']=='0ead9ff71b8c535c4934a9aeca3cafb2349fdf50'
          assert artifact['digest']=='sha256:f6cd5652f9891bcd664aca3b43c1e7d2bedb848c920b5b6305958f300597e4c7'
          print('Trusted Unity 6000.0.64f1 reference assemblies from immutable qualified Player; no binary is executed.')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10896444373'
          run-id: '36210070334'
          github-token: ${{ github.token }}
          path: references
          merge-multiple: true
      - name: Verify original manifest before using managed references
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('references').resolve()
          entries={}
          for row in (root/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
            if not row: continue
            digest, name=row.split('  ',1)
            if name.startswith('DreynoxMmorpg-Map1_Data/Managed/Unity') and name.endswith('.dll'):
              path=(root/name).resolve()
              assert root in path.parents and path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest.lower(), name
              entries[name]=digest
          assert len(entries)>20, 'Reference assembly set is incomplete'
          print(f'{len(entries)} actual Unity DLL hashes verified; compiling source does not execute this Player.')
          PY
      - name: Compile all current runtime CSharp against actual Unity assemblies without stubs
        run: dotnet build Tools/NativeUiHarness/UnityRuntimeContracts.csproj --configuration Release -p:UnityManagedDirectory="$GITHUB_WORKSPACE/references/DreynoxMmorpg-Map1_Data/Managed"
      - name: Scope of these checks
        if: always()
        run: |
          echo 'These jobs validate UI logic, storage and runtime CSharp API compatibility. They do not run the Unity Editor, render screenshots, or certify native pixel equivalence. Full Map1 Player qualification remains separate.' >> "$GITHUB_STEP_SUMMARY"
