name: Apply audited native start source
on:
  push:
    branches: ['work/unity-client-parity-v0.4.0']
    paths: ['.github/workflows/apply-native-start.yml', 'Tools/AuditTransport/native-start.gz.*']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - name: Verify exact source base and transport before applying
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/unity-client-parity-v0.4.0'
          test "$(git rev-parse HEAD^)" = '254310d4364f11de00676cc0c4385523383278a8'
          python - <<'PY'
          import pathlib,hashlib,gzip,subprocess,tempfile
          folder=pathlib.Path('Tools/AuditTransport')
          data=b''.join((folder/('native-start.gz.'+str(i))).read_bytes() for i in range(8))
          assert len(data)==20376 and hashlib.sha256(data).hexdigest()=='e192845e92a98d7310ec6c647695718e85347ea5f462a29026dce7c6034a3876'
          patch=gzip.decompress(data)
          assert len(patch)==92936 and hashlib.sha256(patch).hexdigest()=='dfa5238066160e4b7c3ce7a467eee3843683eee59c8573719e0c401c232905c4'
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch);f.flush()
              subprocess.run(['git','apply','--check','--index',f.name],check=True)
              subprocess.run(['git','apply','--index','--whitespace=error',f.name],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith(('Assets/DreynoxMMORPG/','docs/evidence/')) for p in paths)
          PY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '8.0.x'}
      - name: Validate shared source contracts
        shell: bash
        run: |
          set -euo pipefail
          python Tools/validate_project.py
          dotnet run --project Tools/ParityHarness/ParityHarness.csproj --configuration Release
          dotnet run --project Tools/LocalDataHarness/LocalDataHarness.csproj --configuration Release
          dotnet run --project Tools/CombatHarness/CombatHarness.csproj --configuration Release
      - name: Publish source to work branch only without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          branch='work/unity-client-parity-v0.4.0'
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git restore --worktree SOURCE_SHA256.txt
          git rm Tools/AuditTransport/native-start.gz.{0,1,2,3,4,5,6,7}
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(world): native Map1 start, visible NPC interaction and batched content import [skip ci]'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
