name: Apply audited terrain compatibility
on:
  push:
    branches: ['work/unity-client-parity-v0.4.0']
    paths: ['.github/workflows/apply-terrain-compatibility.yml', '.audit/terrain/**']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: true}
      - name: Guard exact importer and replace the texture block only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/unity-client-parity-v0.4.0'
          python - <<'PY'
          import pathlib,hashlib
          path=pathlib.Path('Assets/DreynoxMMORPG/Editor/LegacyFormats/LegacyWorldTerrainImporter.cs')
          source=path.read_text()
          assert hashlib.sha256(source.encode()).hexdigest()=='8895cb8478ccb6654fb05e900951014ef6a51e5360d82fd6a0a558a176fb261e'
          start=source.index('        private static TerrainLayer[] ImportTerrainLayers(')
          end=source.index('        private static LegacyWaterSurface CreateCanonicalWaterSurface(',start)
          replacement='        private static TerrainLayer[] ImportTerrainLayers(\n            CanonicalClientCorpus corpus,\n            LegacyWldTerrainFile wld)\n        {\n            return LegacyTerrainLayerImporter.Import(corpus, wld, OutputRoot, MapId);\n        }\n\n'
          path.write_text(source[:start]+replacement+source[end:])
          for source,target in [('.audit/terrain/LegacyTerrainLayerImporter.txt','Assets/DreynoxMMORPG/Editor/LegacyFormats/LegacyTerrainLayerImporter.cs'),('.audit/terrain/LegacyTerrainResourceTests.txt','Assets/DreynoxMMORPG/Tests/Editor/LegacyTerrainResourceTests.cs')]:
              output=pathlib.Path(target)
              assert not output.exists()
              output.write_bytes(pathlib.Path(source).read_bytes())
          PY
          python Tools/validate_project.py
          git restore SOURCE_SHA256.txt
          git add Assets/DreynoxMMORPG/Editor/LegacyFormats/LegacyWorldTerrainImporter.cs Assets/DreynoxMMORPG/Editor/LegacyFormats/LegacyTerrainLayerImporter.cs Assets/DreynoxMMORPG/Tests/Editor/LegacyTerrainResourceTests.cs
          git rm -r .audit/terrain
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          test "$(git ls-remote origin refs/heads/work/unity-client-parity-v0.4.0 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(terrain): resolve original WLD TGA names to shipped DDS and batch layers'
          git push origin HEAD:refs/heads/work/unity-client-parity-v0.4.0
