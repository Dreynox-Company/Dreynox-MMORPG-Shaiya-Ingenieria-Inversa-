name: Unity Client Parity

on:
  workflow_dispatch:
  push:
    branches:
      - 'work/unity-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

env:
  UNITY_PROJECT_PATH: .

jobs:
  parity-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Unity project sources
        run: python "Tools/validate_project.py"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and run deterministic client parity harness
        run: dotnet run --project "Tools/ParityHarness/ParityHarness.csproj" --configuration Release

  unity-windows:
    needs: parity-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # Crucial para descargar assets pesados si usas Git LFS

      - name: Prepare Unity activation
        id: unity-license
        shell: bash
        env:
          RAW_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          RAW_UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          RAW_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          RAW_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail

          write_env_multiline() {
            local name="$1"
            local value="$2"
            local delimiter="__DREYNOX_${name}_EOF__"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "${delimiter}"
            } >> "$GITHUB_ENV"
          }

          if [ -n "$RAW_UNITY_SERIAL" ] && [ -n "$RAW_UNITY_EMAIL" ] && [ -n "$RAW_UNITY_PASSWORD" ]; then
            write_env_multiline UNITY_SERIAL "$RAW_UNITY_SERIAL"
            write_env_multiline UNITY_EMAIL "$RAW_UNITY_EMAIL"
            write_env_multiline UNITY_PASSWORD "$RAW_UNITY_PASSWORD"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "mode=serial" >> "$GITHUB_OUTPUT"
            echo "Unity activation mode: serial credentials."
            exit 0
          fi

          if [ -z "$RAW_UNITY_LICENSE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "Unity activation not configured; deterministic C# parity gate still ran."
            exit 0
          fi

          normalized="$RAW_UNITY_LICENSE"
          mode="ulf-raw"

          is_xml_like() {
            printf '%s' "$1" | grep -q '^[[:space:]]*<'
          }

          # GitHub secrets are often stored as base64 to preserve multiline ULF XML.
          # Decode automatically when the raw value is not XML-like.
          if ! is_xml_like "$normalized"; then
            decoded="$(printf '%s' "$normalized" | base64 --decode 2>/dev/null || true)"
            if is_xml_like "$decoded"; then
              normalized="$decoded"
              mode="ulf-base64"
            fi
          fi

          if ! is_xml_like "$normalized"; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "mode=invalid" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE exists but is neither raw ULF XML nor base64-encoded ULF XML."
            exit 0
          fi

          write_env_multiline UNITY_LICENSE "$normalized"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Unity activation mode: $mode."

      - name: Cache Unity Library
        if: steps.unity-license.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Unity EditMode tests
        if: steps.unity-license.outputs.ready == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: ${{ env.UNITY_PROJECT_PATH }}/TestResults

      - name: Build StandaloneWindows64
        if: steps.unity-license.outputs.ready == 'true'
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: Dreynox.Mmorpg.Editor.Build.DreynoxWindowsBuild.BuildParityBatch
          allowDirtyBuild: true

      - name: Upload Windows player
        if: steps.unity-license.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Mmorpg-Parity-Windows-x64
          path: Builds/WindowsParity/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity test evidence
        if: always() && steps.unity-license.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Mmorpg-Unity-TestResults
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
