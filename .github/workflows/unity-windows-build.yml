name: Unity CI · Windows
run-name: "Unity CI · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué debe ejecutar Unity en el runner Windows"
        required: true
        default: full
        type: choice
        options:
          - full
          - tests-only
          - build-only
          - preflight
      clean_library:
        description: "Ignorar caché y regenerar Library desde cero"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - work/unity-client-parity-v0.4.0
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Tools/**"
      - ".github/workflows/unity-windows-build.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Tools/**"
      - ".github/workflows/unity-windows-build.yml"

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PROJECT_PATH: "."

jobs:
  parity-core:
    name: Deterministic parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate Unity project sources
        run: python "$UNITY_PROJECT_PATH/Tools/validate_project.py"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile and run deterministic client parity harness
        run: dotnet run --project "$UNITY_PROJECT_PATH/Tools/ParityHarness/ParityHarness.csproj" --configuration Release

      - name: Parity gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Deterministic parity gate"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  unity-windows:
    name: Unity Personal · Windows x64
    needs: parity-core

    # This repository is public. Never execute fork PR code on the Windows
    # machine that contains the user's Unity Personal named-user entitlement.
    if: github.event_name != 'pull_request'

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 90

    concurrency:
      group: unity-windows-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          clean: false
          persist-credentials: false

      - name: Sanitize workspace while preserving Unity Library
        run: |
          git reset --hard HEAD
          git clean -ffdx -e Library/
          Write-Host "Workspace saneado; Library se conserva para acelerar Unity."

      - name: Prepare reusable Unity Library
        id: library-state
        run: |
          $library = Join-Path $env:GITHUB_WORKSPACE "Library"
          $marker = Join-Path $library ".dreynox-ci-ready"
          $present = $false

          if (Test-Path $library) {
            if (Test-Path $marker) {
              Remove-Item -LiteralPath $marker -Force
              $present = $true
              Write-Host "Library saludable detectada; se reutilizará."
            }
            else {
              Write-Warning "Library sin marcador de run exitoso; se descarta para evitar estado corrupto de un job fallido/cancelado."
              Remove-Item -LiteralPath $library -Recurse -Force
            }
          }

          "present=$($present.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Reusable local Unity Library: $present"

      - name: Force clean Unity Library
        if: github.event_name == 'workflow_dispatch' && inputs.clean_library == true
        run: |
          $library = Join-Path $env:GITHUB_WORKSPACE "Library"
          if (Test-Path $library) {
            Remove-Item -LiteralPath $library -Recurse -Force
          }
          Write-Host "Unity Library limpia solicitada manualmente."

      - name: Restore Unity Library cache
        if: (github.event_name != 'workflow_dispatch' || inputs.clean_library != true) && steps.library-state.outputs.present != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('ProjectSettings/**', 'Packages/**', 'Assets/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Unity Personal entitlement and CLI preflight
        id: unity-preflight
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task preflight

      - name: Unity EditMode tests
        id: unity-tests
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'tests-only'
        timeout-minutes: 20
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task test

      - name: Upload Unity test evidence
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'tests-only')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-Unity-TestResults
          path: ${{ env.UNITY_PROJECT_PATH }}/TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Build StandaloneWindows64
        id: unity-build
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'build-only'
        timeout-minutes: 30
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task build

      - name: Verify build manifest and SHA-256
        id: verify-build
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'build-only'
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "Builds\WindowsParity"
          $exePath = Join-Path $root "DreynoxMmorpg-Parity.exe"
          $manifestPath = Join-Path $root "dreynox-build-manifest.txt"

          if (-not (Test-Path $exePath)) {
            throw "No existe el ejecutable esperado: $exePath"
          }

          if (-not (Test-Path $manifestPath)) {
            throw "No existe el manifest esperado: $manifestPath"
          }

          $manifest = @{}
          Get-Content $manifestPath | ForEach-Object {
            $parts = $_ -split "=", 2
            if ($parts.Count -eq 2) {
              $manifest[$parts[0]] = $parts[1]
            }
          }

          $actualSha = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha = [string]$manifest["sha256"]

          if ([string]::IsNullOrWhiteSpace($expectedSha)) {
            throw "El manifest no contiene sha256."
          }

          if ($actualSha -ne $expectedSha.ToLowerInvariant()) {
            throw "SHA-256 inconsistente. Manifest=$expectedSha Actual=$actualSha"
          }

          @(
            "workflow_run_id=$env:GITHUB_RUN_ID"
            "workflow_run_number=$env:GITHUB_RUN_NUMBER"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF_NAME"
            "runner=$env:RUNNER_NAME"
            "verified_sha256=$actualSha"
            "verified_utc=$((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Set-Content -Path (Join-Path $root "ci-metadata.txt") -Encoding utf8

          "sha256=$actualSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Build verificado: $actualSha"

      - name: Upload Windows player
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'build-only'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-Parity-Windows-x64
          path: ${{ env.UNITY_PROJECT_PATH }}/Builds/WindowsParity/
          if-no-files-found: error
          retention-days: 14

      - name: Smoke capture Windows parity player
        id: smoke-capture
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'build-only'
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "Builds\WindowsParity\DreynoxMmorpg-Parity.exe"
          $captureRoot = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Parity\Unity"
          $capture = Join-Path $captureRoot "parity-lab.png"

          New-Item -ItemType Directory -Force -Path $captureRoot | Out-Null
          Remove-Item -LiteralPath $capture -Force -ErrorAction SilentlyContinue

          $arguments = @(
            "-force-d3d11",
            "-screen-width", "1024",
            "-screen-height", "768",
            "-screen-fullscreen", "0",
            "--parity-capture", "parity-lab",
            "--parity-output", $capture,
            "--parity-settle-frames", "8",
            "--parity-delay", "0.5",
            "--parity-exit"
          )

          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru

          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Parity player no terminó la captura dentro de 60 segundos."
          }

          if ($process.ExitCode -ne 0) {
            throw "Parity player terminó con código $($process.ExitCode)."
          }

          if (-not (Test-Path $capture)) {
            throw "Parity player no generó la captura esperada: $capture"
          }

          $sha = (Get-FileHash -Path $capture -Algorithm SHA256).Hash.ToLowerInvariant()
          "capture_sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Parity smoke capture OK: $capture · $sha"

      - name: Upload Unity parity smoke capture
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'build-only')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-Parity-SmokeCapture
          path: ${{ env.UNITY_PROJECT_PATH }}/Artifacts/Parity/Unity/
          if-no-files-found: warn
          retention-days: 14

      - name: Detect or prepare local ps0032 Character corpus
        id: canonical-corpus
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'build-only'
        run: |
          $expected = "509c4a8fbe4d5292961fdfb6d1045795a7bb5970fcf2560fd1070aee18273c2d"
          $explicit = $env:DREYNOX_CORPUS_ROOT

          function Test-CanonicalCorpus([string]$candidate) {
            if ([string]::IsNullOrWhiteSpace($candidate)) {
              return $null
            }

            try {
              $candidate = [System.IO.Path]::GetFullPath($candidate)
            }
            catch {
              return $null
            }

            if (-not (Test-Path -LiteralPath $candidate -PathType Container)) {
              return $null
            }

            $gameExe = Join-Path $candidate "game.exe"
            $dataRoot = Join-Path $candidate "DATA_Español"

            if (-not (Test-Path -LiteralPath $gameExe -PathType Leaf) -or
                -not (Test-Path -LiteralPath $dataRoot -PathType Container)) {
              return $null
            }

            $actual = (Get-FileHash -LiteralPath $gameExe -Algorithm SHA256).Hash.ToLowerInvariant()

            if ($actual -ne $expected) {
              return $null
            }

            return $candidate
          }

          $resolved = $null
          $source = "none"

          if (-not [string]::IsNullOrWhiteSpace($explicit)) {
            $resolved = Test-CanonicalCorpus $explicit

            if ([string]::IsNullOrWhiteSpace($resolved)) {
              throw "DREYNOX_CORPUS_ROOT está configurado pero no es el corpus ps0032 canónico: $explicit"
            }

            $source = "explicit"
          }
          else {
            $candidates = New-Object System.Collections.Generic.List[string]

            @(
              (Join-Path $env:USERPROFILE "Desktop"),
              (Join-Path $env:USERPROFILE "Downloads"),
              (Join-Path $env:USERPROFILE "Documents")
            ) | ForEach-Object {
              if (Test-Path -LiteralPath $_ -PathType Container) {
                $candidates.Add($_)

                Get-ChildItem -LiteralPath $_ -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                  $candidates.Add($_.FullName)

                  Get-ChildItem -LiteralPath $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                    $candidates.Add($_.FullName)
                  }
                }
              }
            }

            @(
              "C:\Sh",
              "C:\Shaiya",
              "D:\Sh",
              "D:\Shaiya"
            ) | ForEach-Object {
              $candidates.Add($_)
            }

            foreach ($candidate in ($candidates | Select-Object -Unique)) {
              $match = Test-CanonicalCorpus $candidate

              if (-not [string]::IsNullOrWhiteSpace($match)) {
                $resolved = $match
                $source = "extracted"
                break
              }
            }

            if ([string]::IsNullOrWhiteSpace($resolved)) {
              $prepared = @(
                & ./Tools/CI/Prepare-CharacterParityCorpus.ps1
              )

              if ($prepared.Count -gt 0) {
                $candidate = [string]$prepared[$prepared.Count - 1]
                $resolved = Test-CanonicalCorpus $candidate

                if (-not [string]::IsNullOrWhiteSpace($resolved)) {
                  $source = "shzip-minimal"
                }
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($resolved)) {
            "character_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "world_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No se encontró corpus ps0032 ni Sh.zip canónico; los builds de paridad con assets se omiten."
            exit 0
          }

          $requiredCharacter = @(
            "DATA_Español\world\Login.wld",
            "DATA_Español\world\dungeon\dun_login.dg",
            "DATA_Español\character\human\3dc\co_humf_upper003.3dc",
            "DATA_Español\character\human\ani6\humf_019_select.ani",
            "DATA_Español\interface\CharacterMake\basicinfo_bg.tga",
            "DATA_Español\interface\CharacterSelect\selectbg.tga"
          )

          foreach ($relative in $requiredCharacter) {
            $path = Join-Path $resolved $relative

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Corpus ps0032 detectado, pero falta un recurso de Character parity: $relative"
            }
          }

          $worldWld = Join-Path $resolved "DATA_Español\world\0.wld"
          $worldSvmap = Join-Path $resolved "DATA_Español\world\0.svmap"
          $worldAvailable = (Test-Path -LiteralPath $worldWld -PathType Leaf) -and
                            (Test-Path -LiteralPath $worldSvmap -PathType Leaf)

          "DREYNOX_CORPUS_ROOT=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "character_available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "world_available=$($worldAvailable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "root=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Character parity corpus OK: $resolved · source=$source · world=$worldAvailable"

      - name: Build Character ps0032 parity player
        id: character-build
        if: steps.canonical-corpus.outputs.character_available == 'true'
        timeout-minutes: 45
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task character-build

      - name: Verify Character parity build
        id: verify-character
        if: steps.canonical-corpus.outputs.character_available == 'true'
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "Builds\WindowsCharacterParity"
          $exePath = Join-Path $root "DreynoxMmorpg-CharacterParity.exe"
          $manifestPath = Join-Path $root "dreynox-build-manifest.txt"

          if (-not (Test-Path $exePath)) {
            throw "No existe Character parity player: $exePath"
          }

          if (-not (Test-Path $manifestPath)) {
            throw "No existe Character parity manifest: $manifestPath"
          }

          $manifest = @{}
          Get-Content $manifestPath | ForEach-Object {
            $parts = $_ -split "=", 2
            if ($parts.Count -eq 2) {
              $manifest[$parts[0]] = $parts[1]
            }
          }

          $actualSha = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha = [string]$manifest["sha256"]

          if ($actualSha -ne $expectedSha.ToLowerInvariant()) {
            throw "Character parity SHA inconsistente. Manifest=$expectedSha Actual=$actualSha"
          }

          "sha256=$actualSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Character parity build verificado: $actualSha"

      - name: Capture Character visual scenarios
        if: steps.canonical-corpus.outputs.character_available == 'true'
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "Builds\WindowsCharacterParity\DreynoxMmorpg-CharacterParity.exe"
          $captureRoot = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Parity\Character"
          New-Item -ItemType Directory -Force -Path $captureRoot | Out-Null

          $scenarios = @(
            @{ Id = "character-editor"; Delay = "1.5" },
            @{ Id = "character-selection"; Delay = "1.0" }
          )

          foreach ($scenario in $scenarios) {
            $capture = Join-Path $captureRoot ($scenario.Id + ".png")
            Remove-Item -LiteralPath $capture -Force -ErrorAction SilentlyContinue

            $arguments = @(
              "-force-d3d11",
              "-screen-width", "1024",
              "-screen-height", "768",
              "-screen-fullscreen", "0",
              "--parity-scene", $scenario.Id,
              "--parity-capture", $scenario.Id,
              "--parity-output", $capture,
              "--parity-settle-frames", "16",
              "--parity-delay", $scenario.Delay,
              "--parity-exit"
            )

            $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru

            if (-not $process.WaitForExit(90000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Character scenario '$($scenario.Id)' excedió 90 segundos."
            }

            if ($process.ExitCode -ne 0) {
              throw "Character scenario '$($scenario.Id)' terminó con código $($process.ExitCode)."
            }

            if (-not (Test-Path $capture)) {
              throw "No se generó captura Character '$($scenario.Id)'."
            }

            $sha = (Get-FileHash -Path $capture -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($scenario.Id): $sha"
          }

      - name: Detect native game.exe reference screenshots
        id: native-reference
        if: steps.canonical-corpus.outputs.character_available == 'true'
        run: |
          $explicit = $env:DREYNOX_NATIVE_REFERENCE_ROOT

          function Test-NativeReference([string]$candidate) {
            if ([string]::IsNullOrWhiteSpace($candidate) -or
                -not (Test-Path -LiteralPath $candidate -PathType Container)) {
              return $null
            }

            $directEditor = Join-Path $candidate "05-character-editor.png"
            $directSelect = Join-Path $candidate "08-character-selection.png"

            if ((Test-Path -LiteralPath $directEditor -PathType Leaf) -and
                (Test-Path -LiteralPath $directSelect -PathType Leaf)) {
              return [System.IO.Path]::GetFullPath($candidate)
            }

            $nested = Join-Path $candidate "capturas_nativas"
            $nestedEditor = Join-Path $nested "05-character-editor.png"
            $nestedSelect = Join-Path $nested "08-character-selection.png"

            if ((Test-Path -LiteralPath $nestedEditor -PathType Leaf) -and
                (Test-Path -LiteralPath $nestedSelect -PathType Leaf)) {
              return [System.IO.Path]::GetFullPath($nested)
            }

            return $null
          }

          if (-not [string]::IsNullOrWhiteSpace($explicit)) {
            $resolved = Test-NativeReference $explicit

            if ([string]::IsNullOrWhiteSpace($resolved)) {
              throw "DREYNOX_NATIVE_REFERENCE_ROOT está configurado pero no contiene la suite nativa esperada: $explicit"
            }
          }
          else {
            $candidates = New-Object System.Collections.Generic.List[string]

            @(
              (Join-Path $env:USERPROFILE "Desktop"),
              (Join-Path $env:USERPROFILE "Downloads"),
              (Join-Path $env:USERPROFILE "Documents")
            ) | ForEach-Object {
              if (Test-Path -LiteralPath $_ -PathType Container) {
                $candidates.Add($_)

                Get-ChildItem -LiteralPath $_ -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                  $candidates.Add($_.FullName)

                  Get-ChildItem -LiteralPath $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                    $candidates.Add($_.FullName)
                  }
                }
              }
            }

            $resolved = $null

            foreach ($candidate in ($candidates | Select-Object -Unique)) {
              $match = Test-NativeReference $candidate

              if (-not [string]::IsNullOrWhiteSpace($match)) {
                $resolved = $match
                break
              }
            }

            if ([string]::IsNullOrWhiteSpace($resolved)) {
              $prepared = @(
                & ./Tools/CI/Prepare-NativeReferenceSuite.ps1
              )

              if ($prepared.Count -gt 0) {
                $candidate = [string]$prepared[$prepared.Count - 1]
                $resolved = Test-NativeReference $candidate
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($resolved)) {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No se encontró suite nativa local; comparación visual automática se omite."
            exit 0
          }

          "DREYNOX_NATIVE_REFERENCE_ROOT=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "root=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Native game.exe screenshot suite encontrada: $resolved"

      - name: Compare Character Unity captures against native game.exe
        if: steps.canonical-corpus.outputs.character_available == 'true' && steps.native-reference.outputs.available == 'true'
        run: |
          $env:DREYNOX_UNITY_CAPTURE_ROOT = Join-Path $env:GITHUB_WORKSPACE "Artifacts\Parity\Character"
          ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task visual-compare

      - name: Upload Character native-vs-Unity visual parity report
        if: steps.canonical-corpus.outputs.character_available == 'true' && steps.native-reference.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-Character-Native-vs-Unity-Parity
          path: ${{ env.UNITY_PROJECT_PATH }}/Artifacts/Parity/Reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Character parity Windows player
        if: steps.canonical-corpus.outputs.character_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-CharacterParity-Windows-x64
          path: ${{ env.UNITY_PROJECT_PATH }}/Builds/WindowsCharacterParity/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Character parity captures
        if: steps.canonical-corpus.outputs.character_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-CharacterParity-Captures
          path: ${{ env.UNITY_PROJECT_PATH }}/Artifacts/Parity/Character/
          if-no-files-found: error
          retention-days: 14

      - name: Build full canonical ps0032 parity player
        id: canonical-build
        if: steps.canonical-corpus.outputs.world_available == 'true'
        timeout-minutes: 60
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task canonical-build

      - name: Verify full canonical parity build
        id: verify-canonical
        if: steps.canonical-corpus.outputs.world_available == 'true'
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "Builds\WindowsCanonicalParity"
          $exePath = Join-Path $root "DreynoxMmorpg-CanonicalParity.exe"
          $manifestPath = Join-Path $root "dreynox-build-manifest.txt"

          if (-not (Test-Path $exePath)) {
            throw "No existe canonical parity player: $exePath"
          }

          if (-not (Test-Path $manifestPath)) {
            throw "No existe canonical manifest: $manifestPath"
          }

          $manifest = @{}
          Get-Content $manifestPath | ForEach-Object {
            $parts = $_ -split "=", 2
            if ($parts.Count -eq 2) {
              $manifest[$parts[0]] = $parts[1]
            }
          }

          $actualSha = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha = [string]$manifest["sha256"]

          if ($actualSha -ne $expectedSha.ToLowerInvariant()) {
            throw "Canonical SHA inconsistente. Manifest=$expectedSha Actual=$actualSha"
          }

          "sha256=$actualSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Full canonical parity build verificado: $actualSha"

      - name: Smoke local full client flow
        if: steps.canonical-corpus.outputs.world_available == 'true'
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "Builds\WindowsCanonicalParity\DreynoxMmorpg-CanonicalParity.exe"
          $logRoot = Join-Path $env:GITHUB_WORKSPACE "BuildLogs"
          $log = Join-Path $logRoot "canonical-local-flow-smoke.log"

          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue

          $arguments = @(
            "-force-d3d11",
            "-screen-width", "1024",
            "-screen-height", "768",
            "-screen-fullscreen", "0",
            "-logFile", $log,
            "--parity-local-flow-smoke"
          )

          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru

          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Canonical local-flow smoke excedió 120 segundos."
          }

          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) {
              Get-Content -LiteralPath $log -Tail 200
            }

            throw "Canonical local-flow smoke terminó con código $($process.ExitCode)."
          }

          if (-not (Test-Path $log)) {
            throw "Canonical local-flow smoke no produjo log."
          }

          if (-not (Select-String -LiteralPath $log -Pattern "DREYNOX_LOCAL_FLOW_SMOKE_OK" -SimpleMatch -Quiet)) {
            Get-Content -LiteralPath $log -Tail 200
            throw "Canonical local-flow smoke terminó sin marcador OK."
          }

          Write-Host "Canonical Login -> Select -> Make -> Select -> World smoke: OK"

      - name: Upload canonical parity Windows player
        if: steps.canonical-corpus.outputs.world_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-CanonicalParity-Windows-x64
          path: ${{ env.UNITY_PROJECT_PATH }}/Builds/WindowsCanonicalParity/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity build log
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'build-only')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dreynox-Mmorpg-Unity-BuildLogs
          path: ${{ env.UNITY_PROJECT_PATH }}/BuildLogs/
          if-no-files-found: warn
          retention-days: 14

      - name: Mark Unity Library reusable
        if: success()
        run: |
          $library = Join-Path $env:GITHUB_WORKSPACE "Library"
          if (Test-Path $library) {
            @(
              "status=success"
              "commit=$env:GITHUB_SHA"
              "run_id=$env:GITHUB_RUN_ID"
              "completed_utc=$((Get-Date).ToUniversalTime().ToString('o'))"
            ) | Set-Content -Path (Join-Path $library ".dreynox-ci-ready") -Encoding utf8
            Write-Host "Library marcada como saludable para el siguiente run."
          }

      - name: Failure diagnostics
        if: failure()
        run: |
          Write-Host "===== Unity CI diagnostics ====="
          @(
            "TestResults/editmode-editor.log",
            "BuildLogs/windows-parity-editor.log"
          ) | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE $_
            if (Test-Path $path) {
              Write-Host ""
              Write-Host "----- $_ (últimas 160 líneas) -----"
              Get-Content -Path $path -Tail 160
            }
          }

      - name: Unity CI summary
        if: always()
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          CLEAN_LIBRARY: ${{ inputs.clean_library }}
          TEST_OUTCOME: ${{ steps.unity-tests.outcome }}
          BUILD_OUTCOME: ${{ steps.unity-build.outcome }}
          VERIFIED_SHA256: ${{ steps.verify-build.outputs.sha256 }}
        run: |
          $mode = if ([string]::IsNullOrWhiteSpace($env:DISPATCH_MODE)) { "full" } else { $env:DISPATCH_MODE }
          $sha = if ([string]::IsNullOrWhiteSpace($env:VERIFIED_SHA256)) { "-" } else { $env:VERIFIED_SHA256 }
          $tests = if ([string]::IsNullOrWhiteSpace($env:TEST_OUTCOME)) { "skipped" } else { $env:TEST_OUTCOME }
          $build = if ([string]::IsNullOrWhiteSpace($env:BUILD_OUTCOME)) { "skipped" } else { $env:BUILD_OUTCOME }

          @(
            "## Dreynox MMORPG · Unity Windows CI"
            ""
            "| Campo | Valor |"
            "|---|---|"
            "| Runner | \`$env:RUNNER_NAME\` |"
            "| Ref | \`$env:GITHUB_REF_NAME\` |"
            "| Commit | \`$env:GITHUB_SHA\` |"
            "| Modo | \`$mode\` |"
            "| Clean Library | \`$env:CLEAN_LIBRARY\` |"
            "| EditMode tests | \`$tests\` |"
            "| Windows build | \`$build\` |"
            "| SHA-256 | \`$sha\` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  pipeline-summary:
    name: CI summary
    needs:
      - parity-core
      - unity-windows
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Final workflow summary
        shell: bash
        run: |
          {
            echo "## Unity CI · Resultado final"
            echo ""
            echo "| Gate | Resultado |"
            echo "|---|---|"
            echo "| Deterministic parity | \`${{ needs.parity-core.result }}\` |"
            echo "| Unity Windows x64 | \`${{ needs.unity-windows.result }}\` |"
            echo ""
            echo "Event: \`${{ github.event_name }}\` · Ref: \`${{ github.ref_name }}\` · SHA: \`${{ github.sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
