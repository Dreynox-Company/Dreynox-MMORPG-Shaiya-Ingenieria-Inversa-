name: Unity Client Parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/unity-reverse-engineering-v0.2.0
      - chore/unity-personal-self-hosted-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

env:
  UNITY_PROJECT_PATH: "."

jobs:
  parity-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Unity project sources
        run: python "$UNITY_PROJECT_PATH/Tools/validate_project.py"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile and run deterministic client parity harness
        run: dotnet run --project "$UNITY_PROJECT_PATH/Tools/ParityHarness/ParityHarness.csproj" --configuration Release

  unity-windows:
    needs: parity-core

    # SECURITY: this repository is public. Never execute fork PR code on the
    # self-hosted Windows machine that contains the Unity Personal entitlement.
    if: github.event_name != 'pull_request'

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 60

    concurrency:
      group: unity-personal-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json', 'Assets/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Unity Personal entitlement and CLI preflight
        shell: pwsh
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task preflight

      - name: Unity EditMode tests
        shell: pwsh
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task test

      - name: Upload Unity test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Mmorpg-Unity-TestResults
          path: |
            ${{ env.UNITY_PROJECT_PATH }}/TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Build StandaloneWindows64
        shell: pwsh
        run: ./Tools/CI/Invoke-UnitySelfHosted.ps1 -Task build

      - name: Upload Windows player
        uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Mmorpg-Parity-Windows-x64
          path: ${{ env.UNITY_PROJECT_PATH }}/Builds/WindowsParity/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Mmorpg-Unity-BuildLogs
          path: ${{ env.UNITY_PROJECT_PATH }}/BuildLogs/
          if-no-files-found: warn
          retention-days: 14
