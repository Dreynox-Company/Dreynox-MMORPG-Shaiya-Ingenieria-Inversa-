name: Unity Windows baseline
on:
  workflow_dispatch:
  push:
    branches:
      - work/unity-reverse-engineering-v0.2.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository structure
        run: python Tools/validate_project.py

  unity-windows:
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Unity license secret
        id: unity-license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE is not configured; source validation remains active and the player build is skipped."
          fi
      - name: Cache Unity Library
        if: steps.unity-license.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
      - name: Build StandaloneWindows64
        if: steps.unity-license.outputs.ready == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: Dreynox.Mmorpg.Editor.Build.DreynoxWindowsBuild.BuildBatch
          allowDirtyBuild: true
      - name: Upload Windows player
        if: steps.unity-license.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dreynox-Mmorpg-Windows-x64
          path: Builds/Windows/
          if-no-files-found: error
          retention-days: 14
