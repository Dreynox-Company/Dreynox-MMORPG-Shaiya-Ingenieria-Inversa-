name: Apply reviewed corpus compatibility fixes
on:
  push:
    branches: ['work/unity-client-parity-v0.4.0']
    paths: ['.github/workflows/apply-corpus-compatibility.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify exact source patch before modifying any source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/unity-client-parity-v0.4.0'
          test "$(git rev-parse HEAD^)" = 'dd35ae8953c4f5908ad9cfc656124f2b375da517'
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, tempfile
          data = pathlib.Path('.github/corpus-fixes.transport').read_bytes()
          # Restore two dropped transport characters, then require the original
          # local SHA-256 for BOTH compressed and decoded patch. Never apply an
          # unverified or partially reconstructed source patch.
          encoded = base64.b64encode(data).decode().rstrip('=')
          assert encoded[390:396] == 'fisgcD'
          encoded = encoded[:395] + 'ic' + encoded[395:]
          packed = base64.b64decode(encoded, validate=True)
          assert len(packed) == 6117
          assert hashlib.sha256(packed).hexdigest() == 'f33a2a38e63e1366dc646a5442f1591dc3559e018a9758e9333f28443d828441'
          patch = gzip.decompress(packed)
          assert len(patch) == 27573
          assert hashlib.sha256(patch).hexdigest() == 'f10a94f14f08b739bff1f1033a7fea28df2e1cfa47d747921113ad970910bd42'
          with tempfile.NamedTemporaryFile(suffix='.patch') as handle:
              handle.write(patch); handle.flush()
              subprocess.run(['git','apply','--check','--index',handle.name],check=True)
              subprocess.run(['git','apply','--index','--whitespace=error',handle.name],check=True)
          names = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(n.startswith(('Assets/','docs/')) for n in names)
          PY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Test deterministic source before commit
        run: |
          set -euo pipefail
          python Tools/validate_project.py
          dotnet run --project Tools/ParityHarness/ParityHarness.csproj --configuration Release
          dotnet run --project Tools/LocalDataHarness/LocalDataHarness.csproj --configuration Release
      - name: Commit source only on work branch
        run: |
          set -euo pipefail
          branch='work/unity-client-parity-v0.4.0'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git restore --worktree SOURCE_SHA256.txt
          git rm .github/corpus-fixes.transport
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(world): match actual DG WLD MON corpus and configure URP'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
