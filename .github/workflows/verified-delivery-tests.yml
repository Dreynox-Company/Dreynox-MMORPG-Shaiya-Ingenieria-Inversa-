name: Verified executable delivery tests
on:
  push:
    branches: ['work/unity-client-parity-v0.4.0']
    paths: ['Tools/Delivery/**', 'Tools/DeliveryTests/**', '.github/workflows/verified-delivery-tests.yml']
  pull_request:
    paths: ['Tools/Delivery/**', 'Tools/DeliveryTests/**', '.github/workflows/verified-delivery-tests.yml']
permissions: {contents: read}
jobs:
  archive-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '8.0.x'}
      - run: dotnet run --project Tools/DeliveryTests/DeliveryTests.csproj --configuration Release
  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Compile and exercise the exact Framework extraction path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('delivery-'+[Guid]::NewGuid().ToString('N'))
          $payloadRoot=Join-Path $root 'payload'
          New-Item -ItemType Directory -Path (Join-Path $payloadRoot 'DreynoxMmorpg-Map1_Data') -Force | Out-Null
          # Labelled archive fixtures, never launched as a game or uploaded.
          'DELIVERY FIXTURE, NOT A GAME EXECUTABLE' | Set-Content (Join-Path $payloadRoot 'DreynoxMmorpg-Map1.exe')
          'DELIVERY FIXTURE, NOT A NATIVE DLL' | Set-Content (Join-Path $payloadRoot 'UnityPlayer.dll')
          'DELIVERY FIXTURE, NOT GAME DATA' | Set-Content (Join-Path $payloadRoot 'DreynoxMmorpg-Map1_Data/globalgamemanagers')
          $rows=@(Get-ChildItem $payloadRoot -Recurse -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()+'  '+$_.FullName.Substring($payloadRoot.Length+1).Replace('\','/')
          })
          $rows | Set-Content (Join-Path $payloadRoot 'SHA256SUMS.txt') -Encoding UTF8
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $payload=Join-Path $root 'payload.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($payloadRoot,$payload)
          $archive=[IO.Compression.ZipFile]::OpenRead($payload)
          try { foreach($entry in $archive.Entries){Write-Host ('Fixture entry: '+$entry.FullName)} } finally {$archive.Dispose()}
          $hash=(Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          $identity=Join-Path $root 'PayloadIdentity.cs'
          "namespace Dreynox.Delivery { internal static class PayloadIdentity { public const string Sha256 = `"$hash`"; } }" | Set-Content $identity
          $exe=Join-Path $root 'DeliveryTest.exe'
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $core=(Resolve-Path -LiteralPath 'Tools/Delivery/VerifiedPlayerArchive.cs').Path
          $metadata=(Resolve-Path -LiteralPath 'Tools/Delivery/PlayerZipMetadata.cs').Path
          $launcher=(Resolve-Path -LiteralPath 'Tools/Delivery/PortablePlayerLauncher.cs').Path
          & $compiler /nologo /target:winexe /platform:x64 /langversion:5 "/out:$exe" "/resource:$payload,Dreynox.PlayerPayload" /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.Windows.Forms.dll /reference:System.Drawing.dll $identity $core $metadata $launcher
          if($LASTEXITCODE -ne 0){throw 'Windows Framework delivery wrapper compilation failed.'}
          function Test-Child([int]$expected,[string]$label) {
            $stderr=Join-Path $root ($label+'.stderr.log')
            $stdout=Join-Path $root ($label+'.stdout.log')
            $p=Start-Process -FilePath $exe -ArgumentList '--verify-only' -PassThru -RedirectStandardError $stderr -RedirectStandardOutput $stdout
            if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw 'Fixture timed out.'}
            $p.Refresh()
            if(Test-Path $stderr){Get-Content $stderr | Write-Host}
            if(Test-Path $stdout){Get-Content $stdout | Write-Host}
            if($p.ExitCode -ne $expected){throw "Child $label returned $($p.ExitCode), expected $expected."}
          }
          Test-Child 0 'extract'
          Test-Child 0 'cached'
          $cache=Join-Path $env:LOCALAPPDATA ("Dreynox/PlayableClient/"+$hash)
          'not in the embedded manifest' | Set-Content (Join-Path $cache 'unlisted.dll')
          Test-Child 1 'injected'
          Write-Host 'DELIVERY_FRAMEWORK_EXTRACTION_CACHE_TAMPER_OK. No game executed and no fixture published.'
